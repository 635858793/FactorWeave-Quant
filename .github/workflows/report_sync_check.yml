name: Report Code Sync Check (R181 HVD-181-A)

# R181 HVD-181-A 报告-代码双向同步 check_sum CI 集成 (2026-07-25)
# 目的: 永久防御 R180-D P0 数据丢失事故 (16 备份文件 2.57 MB 永久丢失)
# 机制:
#   1. 报告中嵌入 [CODE.SYNC.CHECKSUM] 标记 (SHA-256 + 行号锚定)
#   2. CI 自动核验代码与报告 hash 一致性
#   3. 30 天未更新报告自动标注 [STALE]
# 触发: 报告文件修改 + 代码修改 + 每周一定时扫描
# 拦截: warning (不阻断 CI, 但记录 STALE 状态 + artifact)
# 强约束: R104 §12 5 铁律 + R85 假修复鉴别 4 步法 + R6 §6.1 8 铁律

on:
  push:
    branches: [main, dev, release/*]
    paths:
      - 'core/**/*.py'
      - 'gui/**/*.py'
      - 'tests/**/*.py'
      - 'web/**/*.py'
      - 'scripts/**/*.py'
      - 'tools/report_code_sync.py'
      - 'tools/check_stale_reports.py'
      - '.trae/reports/**/*.md'
  pull_request:
    branches: [main, dev]
    paths:
      - 'core/**/*.py'
      - 'gui/**/*.py'
      - 'tests/**/*.py'
      - 'web/**/*.py'
      - 'scripts/**/*.py'
      - 'tools/report_code_sync.py'
      - 'tools/check_stale_reports.py'
      - '.trae/reports/**/*.md'
  schedule:
    # 每周一 09:00 UTC+8 (北京时间) 自动运行
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      stale_threshold_days:
        description: 'STALE threshold (days)'
        required: false
        default: '30'
      exit_code_on_stale:
        description: 'Exit non-zero on STALE'
        required: false
        default: 'false'

jobs:
  report-code-sync:
    name: Report Code Sync Check (R181 HVD-181-A)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 便于追溯

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # 工具仅用标准库, 无外部依赖

      - name: Check report vs code (R181 HVD-181-A check_sum)
        id: sync-check
        run: |
          echo "===== R181 HVD-181-A 报告-代码 check_sum 核验 ====="
          # 扫描所有 R-N 报告, 核验 check_sum
          REPORT_COUNT=0
          SYNC_ISSUE_COUNT=0
          P0_COUNT=0
          P1_COUNT=0
          for report in .trae/reports/delivery/*.md; do
            if [ ! -f "$report" ]; then continue; fi
            REPORT_COUNT=$((REPORT_COUNT + 1))
            if grep -q '\[CODE.SYNC.CHECKSUM\]' "$report"; then
              echo "Check: $report"
              RESULT=$(python tools/report_code_sync.py \
                --project-root . \
                --report "$report" \
                --output-format json 2>&1 || true)
              ISSUES=$(echo "$RESULT" | python -c "import json, sys; d=json.load(sys.stdin); print(d.get('issue_count', 0))" 2>/dev/null || echo "0")
              SYNC_ISSUE_COUNT=$((SYNC_ISSUE_COUNT + ISSUES))
              if [ "$ISSUES" -gt 0 ]; then
                echo "  ⚠️ $report: $ISSUES 个 sync issue"
              fi
            fi
          done
          echo "REPORT_COUNT=$REPORT_COUNT" >> $GITHUB_ENV
          echo "SYNC_ISSUE_COUNT=$SYNC_ISSUE_COUNT" >> $GITHUB_ENV
          echo "===== R181 HVD-181-A 核验完成: $REPORT_COUNT 报告, $SYNC_ISSUE_COUNT sync issues ====="

      - name: Scan STALE reports (R181 HVD-181-A 任务 4)
        id: stale-scan
        run: |
          echo "===== R181 HVD-181-A 任务 4: STALE 报告检测 ====="
          python tools/check_stale_reports.py \
            --project-root . \
            --stale-threshold-days ${{ github.event.inputs.stale_threshold_days || '30' }} \
            --output-format json \
            --output .trae/reports/monitoring/stale_scan_$(date +%Y%m%d).json
          STALE_COUNT=$(python -c "import json; d=json.load(open('.trae/reports/monitoring/stale_scan_$(date +%Y%m%d).json')); print(d.get('stale_count', 0))")
          echo "STALE_COUNT=$STALE_COUNT" >> $GITHUB_ENV
          echo "===== STALE 报告: $STALE_COUNT 个 ====="

      - name: Run TDD tests (R181 HVD-181-A 8 测试)
        id: tdd-tests
        run: |
          echo "===== R181 HVD-181-A TDD 8 测试全量回归 ====="
          python -m pytest tests/test_r181_hvd_181_a_report_code_sync.py -v 2>&1 | tail -30
          TDD_EXIT=$?
          echo "TDD_EXIT=$TDD_EXIT" >> $GITHUB_ENV

      - name: Upload sync report artifact
        if: always()
        run: |
          mkdir -p ci-artifacts
          # 收集所有监控输出
          if [ -f ".trae/reports/monitoring/stale_scan_$(date +%Y%m%d).json" ]; then
            cp ".trae/reports/monitoring/stale_scan_$(date +%Y%m%d).json" \
               "ci-artifacts/stale_scan_report.json"
          fi
          # 综合报告
          cat <<EOF > ci-artifacts/r181_hvd_181_a_summary.json
{
  "report_count": ${REPORT_COUNT:-0},
  "sync_issue_count": ${SYNC_ISSUE_COUNT:-0},
  "stale_count": ${STALE_COUNT:-0},
  "tdd_exit_code": ${TDD_EXIT:-0},
  "scan_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
}
EOF
          echo "Summary saved: ci-artifacts/r181_hvd_181_a_summary.json"
          cat ci-artifacts/r181_hvd_181_a_summary.json

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r181-hvd-181-a-report
          path: ci-artifacts/
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'ci-artifacts/r181_hvd_181_a_summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('Summary file not found, skipping comment');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const reportCount = summary.report_count || 0;
            const syncIssues = summary.sync_issue_count || 0;
            const staleCount = summary.stale_count || 0;
            const tddExit = summary.tdd_exit_code || 0;
            const statusEmoji = tddExit === 0 ? '✅' : '❌';
            const statusText = tddExit === 0 ? 'PASS' : 'FAIL';
            const body = `## ${statusEmoji} R181 HVD-181-A 报告-代码同步检查 (${statusText})

            **扫描报告数**: ${reportCount}
            **check_sum sync issues**: ${syncIssues}
            **STALE 报告 (30天未更新)**: ${staleCount}
            **TDD 测试 (8 个)**: ${tddExit === 0 ? '全部通过' : '失败'}

            ${syncIssues > 0 ? '⚠️ **报告中 check_sum 与代码 hash 不一致, 需重新生成 check_sum**\n' : ''}
            ${staleCount > 0 ? `⚠️ **${staleCount} 个报告超过 30 天未更新, 建议重新审计**\n` : ''}
            ${tddExit !== 0 ? '❌ **TDD 测试失败, 修复后再合并**\n' : ''}

            📊 完整报告: \`ci-artifacts/r181_hvd_181_a_summary.json\`

            <details>
            <summary>📋 详情</summary>

            - **强制度合规**: R104 §12 5 铁律 + R6 §6.1 8 铁律 + R85 假修复鉴别 4 步法
            - **check_sum 格式**: \`[CODE.SYNC.CHECKSUM]: file:start-end=sha256\`
            - **STALE 阈值**: 30 天 (可配置)
            - **R180-D 教训**: TDD PASSED ≠ 物理归档成功, check_sum 是永久防御

            </details>
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Warning on issues (not blocking)
        if: env.SYNC_ISSUE_COUNT != '0' || env.STALE_COUNT != '0'
        run: |
          echo "⚠️ R181 HVD-181-A 发现 sync/STALE 问题 (warning, 不阻断 CI)"
          echo "  - Sync issues: $SYNC_ISSUE_COUNT"
          echo "  - STALE reports: $STALE_COUNT"
          echo "建议: 1) 重新生成 check_sum  2) 重新审计 STALE 报告"
          # 不阻断, 仅记录
          exit 0

      - name: Fail job on TDD failure
        if: env.TDD_EXIT != '0'
        run: |
          echo "❌ R181 HVD-181-A TDD 测试失败: 退出码 $TDD_EXIT"
          echo "TDD 测试必须 100% 通过, 修复后重试"
          exit $TDD_EXIT
