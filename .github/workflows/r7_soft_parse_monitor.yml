name: R7-§7.1-#5 软解析监控 (R133 永久 CI 集成)

# R7 §7.1 #5 永久化: 每次 PR 扫描 R51 软解析点, 阻止 P1 关键服务静默退化
# R133 立项 (2026-07-14): 监控脚本升级 CI 模式 + GitHub Actions 集成
# R11-7 待办完成: tools/monitor_soft_parse.py 接入 CI 流水线
# R85 假修复鉴别 4 步法: 监控脚本本身是 R132 上线真品, R133 仅增强 CI 模式 (向后兼容)
# 当前基线 (R133 验证, 2026-07-14): P1 违规 4, P2 维持 12, OK 验证 15, 总计 31

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
    paths:
      - 'core/**'
      - 'gui/**'
      - 'tests/**'
      - 'scripts/**'
      - 'web/backend/**'
      - 'tools/monitor_soft_parse.py'
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 持续监控, 防止静默漂移
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 手动触发 (调试 / 紧急扫描)

env:
  PYTHON_VERSION: '3.11'
  # 默认阈值: P1 违规 0 (任何软解析关键服务违规即失败)
  DEFAULT_THRESHOLD_P1: 0
  DEFAULT_THRESHOLD_P2: 20
  DEFAULT_THRESHOLD_OK: 15

jobs:
  r7-soft-parse-monitor:
    name: R7 §7.1 #5 软解析监控 (R133 增强)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # PR 评论需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于增量扫描

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 仅需 stdlib, 无第三方依赖
      - name: 验证 Python 环境
        run: |
          python --version
          python -c "import ast, json, re, sys; print('✅ stdlib 验证通过 (ast/json/re/sys)')"

      - name: 准备扫描路径
        id: paths
        run: |
          mkdir -p .audit_reports/r7_soft_parse
          echo "monitor_script=tools/monitor_soft_parse.py" >> $GITHUB_OUTPUT
          echo "search_dirs=core,gui,tests,scripts,web/backend" >> $GITHUB_OUTPUT

      - name: 运行监控脚本 (CI 模式 + JSON 报告)
        id: monitor
        run: |
          echo "===== R7 §7.1 #5 软解析监控 ====="
          echo "工具: ${{ steps.paths.outputs.monitor_script }}"
          echo "搜索目录: ${{ steps.paths.outputs.search_dirs }}"
          echo "阈值: P1<=${{ env.DEFAULT_THRESHOLD_P1 }} P2<=${{ env.DEFAULT_THRESHOLD_P2 }} OK>=${{ env.DEFAULT_THRESHOLD_OK }}"
          echo ""

          set +e
          python ${{ steps.paths.outputs.monitor_script }} \
            --ci-mode \
            --exit-code-on-violation \
            --report-format json \
            --threshold-p1 ${{ env.DEFAULT_THRESHOLD_P1 }} \
            --threshold-p2 ${{ env.DEFAULT_THRESHOLD_P2 }} \
            --threshold-ok ${{ env.DEFAULT_THRESHOLD_OK }} \
            --output .audit_reports/r7_soft_parse/monitor_$(date -u +%Y%m%d_%H%M%S).json
          MONITOR_EXIT=$?
          set -e
          echo "monitor_exit_code=${MONITOR_EXIT}" >> $GITHUB_OUTPUT
          echo ""
          echo "===== 监控完成 (退出码: ${MONITOR_EXIT}) ====="
          # 当前基线 (R133 验证 2026-07-14): P1 违规 4 → 必然 exit 1
          # 这是预期行为, 阻断 PR 合并, 推动业务方升级

      - name: 上传报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-soft-parse-report
          path: .audit_reports/r7_soft_parse/
          retention-days: 30

      - name: PR 评论 (合规摘要 + R7 §7.1 #5 防御报告)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportDir = '.audit_reports/r7_soft_parse';
            const summaryFiles = fs.readdirSync(reportDir).filter(f => f.endsWith('.json'));
            if (summaryFiles.length === 0) {
              console.log('No JSON report found, skipping PR comment');
              return;
            }
            // 取最新一份
            const latest = summaryFiles.sort().reverse()[0];
            const reportPath = path.join(reportDir, latest);

            let data;
            try {
              data = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
            } catch (e) {
              console.log(`Failed to parse report: ${e.message}`);
              return;
            }

            // 读取完整 JSON 报告 (含 violations)
            const fullReport = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
            const violations = fullReport.violations || [];
            const p1Violations = violations.filter(v => v.severity === 'P1');

            let body = '## 🛡️ R7 §7.1 #5 软解析监控报告 (R133 增强)\n\n';
            body += '**R7 §7.1 #5 教训**: 软解析关键服务静默失败 → 业务退化为降级模式 (R51 案例: AdvancedRiskControlService)\n';
            body += '**监控工具**: `tools/monitor_soft_parse.py`\n';
            body += '**报告路径**: `' + reportPath + '`\n\n';

            // 合规摘要
            const cs = data.compliance_status || (p1Violations.length > 0 ? 'FAIL' : 'PASS');
            const statusEmoji = cs === 'PASS' ? '✅' : (cs === 'PASS_WITH_WARNINGS' ? '⚠️' : '❌');
            body += `### ${statusEmoji} 合规状态: **${cs}**\n\n`;
            body += '| 指标 | 当前值 | 阈值 | 状态 |\n';
            body += '|:----:|:------:|:----:|:----:|\n';
            const summary = fullReport.summary || {};
            body += `| P1 违规 (关键服务) | **${summary.p1_violation || 0}** | ≤ 0 | ${(summary.p1_violation || 0) === 0 ? '✅' : '❌'} |\n`;
            body += `| P2 维持 (R51 合规) | ${summary.p2_maintain || 0} | < 20 | ${(summary.p2_maintain || 0) < 20 ? '✅' : '⚠️'} |\n`;
            body += `| OK 验证 (防御完整) | ${summary.ok_verified || 0} | ≥ 15 | ${(summary.ok_verified || 0) >= 15 ? '✅' : '⚠️'} |\n`;
            body += `| 总计 | ${summary.total || 0} | - | - |\n\n`;

            if (p1Violations.length > 0) {
              body += `### ❌ P1 违规点 (${p1Violations.length} 处, 必须升级)\n\n`;
              body += '| 文件 | 行号 | 服务类型 | R51 步法 | 修复建议 |\n';
              body += '|:-----|:----:|:--------:|:--------:|:---------|\n';
              for (const v of p1Violations) {
                body += `| \`${v.file_path}\` | ${v.line_number} | ${v.service_type} | 步 ${v.r51_step} | ${v.remediation} |\n`;
              }
              body += '\n';
              body += '> **R51 步 1+5 双重违规**: 关键服务 + 缺显式 warning, 升级 `try_resolve` → `resolve + try/except` 显式降级日志\n\n';
            } else {
              body += '### ✅ 无 P1 违规点 (R7 §7.1 #5 防御完整)\n\n';
            }

            // R51 步法分布
            const stepDist = fullReport.r51_step_distribution || {};
            body += '### 📊 R51 5 步法分布\n\n';
            body += '| 步法 | 描述 | 命中数 |\n';
            body += '|:----:|:-----|:------:|\n';
            const stepDesc = {
              1: '步 1 关键服务 (需升级)',
              2: '步 2 非关键服务 (维持)',
              3: '步 3 self-loop 防御 (维持)',
              4: '步 4 可选依赖 (维持 + warning)',
              5: '步 5 关键服务 + 完整防御 (维持)'
            };
            for (let s = 1; s <= 5; s++) {
              body += `| ${s} | ${stepDesc[s]} | ${stepDist[s] || 0} |\n`;
            }
            body += '\n';

            body += '---\n';
            body += '**项目规则**: 参见 `.trae/rules/project_rules.md` §7.1 #5\n';
            body += '**监控脚本**: `tools/monitor_soft_parse.py` (R132 立项 / R133 CI 模式增强)\n';
            body += '**报告归档**: `.trae/reports/monitoring/soft_parse_monitor_<date>.json`\n';

            // 查找已有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('R7 §7.1 #5 软解析监控报告')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: 阻断合并 (P1 违规 > 0)
        if: steps.monitor.outputs.monitor_exit_code == '1'
        run: |
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          echo " R7 §7.1 #5 软解析监控失败!"
          echo " P1 违规 > 阈值, 关键服务存在静默软解析"
          echo " 请修复后重新提交 PR"
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          exit 1
