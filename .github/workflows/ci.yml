name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'hotfix/**', 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 80

jobs:
  lint-and-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装质量检查工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy ruff

      - name: 运行 flake8 检查
        run: |
          flake8 --max-line-length=120 --extend-ignore=E203 core/ tests/ scripts/
          if [ $? -ne 0 ]; then
            echo "flake8 检查失败"
            exit 1
          fi

      - name: 运行 black 格式化检查
        run: |
          black --check --line-length 120 core/ tests/ scripts/
          if [ $? -ne 0 ]; then
            echo "black 格式检查失败"
            exit 1
          fi

      - name: 运行 mypy 类型检查
        run: |
          mypy --ignore-missing-imports core/
          if [ $? -ne 0 ]; then
            echo "mypy 类型检查失败"
            exit 1
          fi

      - name: 运行 ruff 检查
        run: |
          ruff check --line-length 120 core/ tests/ scripts/
          if [ $? -ne 0 ]; then
            echo "ruff 检查失败"
            exit 1
          fi

  # R237-A-001 HVD-32 9 指标元数据一致性 CI 检查 (P1 实施)
  hvd-32-metadata-check:
    name: "HVD-32 9 指标元数据一致性检查"
    runs-on: ubuntu-latest
    needs: lint-and-quality
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 运行 9 指标元数据一致性检查
        run: |
          echo "=========================================="
          echo " HVD-32 9 指标元数据一致性 CI 检查"
          echo " 指标: MA, MACD, RSI, KDJ, AD, AROON, DEMA, TEMA, NATR"
          echo "=========================================="
          python tools/indicator_metadata_audit.py \
            --indicators "MA,MACD,RSI,KDJ,AD,AROON,DEMA,TEMA,NATR" \
            --fail-on-missing
          if [ $? -ne 0 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo " HVD-32 9 指标元数据检查失败!"
            echo " 缺元数据指标会导致业务方拿到错误参数"
            echo " 合并已被阻止, 请补全 supported_params"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi
          echo ""
          echo "HVD-32 9 指标元数据 100% 完整, 检查通过"

  critical-risk-gate:
    name: "P0致命风险门禁 (风控/止损/安全)"
    runs-on: ubuntu-latest
    needs: lint-and-quality
    timeout-minutes: 15
    env:
      P0_TEST_FILE: tests/test_p0_risk_fixes.py
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install pytest pytest-cov

      - name: "强制门禁: P0 风控/止损致命测试"
        id: p0_gate
        run: |
          echo "========================================="
          echo " P0 致命风险门禁: 风控 fail-closed + 做空止损"
          echo "========================================="
          pytest ${{ env.P0_TEST_FILE }} \
            -v \
            --tb=short \
            --junitxml=p0-gate-results.xml \
            --durations=0
          if [ $? -ne 0 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo " P0 风险门禁失败!"
            echo " 风控异常可能静默放行或做空止损方向错误"
            echo " 合并已被阻止,请先修复以上致命缺陷"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi
          echo ""
          echo "P0 致命风险门禁全部通过"
          echo "风控 fail-closed: OK"
          echo "做空止损方向:   OK"

      - name: 上传 P0 门禁报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-critical-gate-report
          path: p0-gate-results.xml

  test:
    name: 自动化测试 (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    needs: critical-risk-gate
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install pytest pytest-cov pytest-html coverage

      - name: 运行测试
        run: |
          pytest tests/ -v --tb=short --html=report.html --self-contained-html
          if [ $? -ne 0 ]; then
            echo "测试执行失败"
            exit 1
          fi

      - name: 生成覆盖率报告
        run: |
          pytest tests/ --cov=core --cov-report=xml --cov-report=term-missing --cov-report=html
          if [ $? -ne 0 ]; then
            echo "覆盖率报告生成失败"
            exit 1
          fi

      - name: 安装 bc 命令
        run: sudo apt-get install -y bc

      - name: 检查整体覆盖率阈值
        run: |
          TOTAL_COVERAGE=$(grep -oP '(?<=<coverage .*line-rate=")[^"]*' coverage.xml | head -1)
          TOTAL_COVERAGE=$(echo "$TOTAL_COVERAGE * 100" | bc | cut -d'.' -f1)
          echo "当前测试覆盖率: ${TOTAL_COVERAGE}%"
          if [ "$TOTAL_COVERAGE" -lt "$MIN_COVERAGE" ]; then
            echo "错误: 测试覆盖率 ${TOTAL_COVERAGE}% 低于最低要求 ${MIN_COVERAGE}%"
            exit 1
          fi
          echo "覆盖率检查通过: ${TOTAL_COVERAGE}% >= ${MIN_COVERAGE}%"

      - name: 上传质量门禁报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-report
          path: |
            coverage_quality_gate_report.json
            coverage.json

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}
          path: |
            report.html
            coverage.xml
            htmlcov/

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security-check:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint-and-quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装安全扫描工具
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: 运行 Bandit 安全检查
        run: |
          bandit -r core/ -f json -o bandit_report.json
          if [ $? -ne 0 ]; then
            echo "Bandit 检查发现问题"
            cat bandit_report.json
            exit 1
          fi

      - name: 运行 Safety 检查
        run: |
          safety check -r requirements.txt --json > safety_report.json || {
            echo "Safety 检查发现潜在安全问题:"
            cat safety_report.json
            echo "警告: 存在已知漏洞的依赖项"
          }

      - name: 上传安全报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            bandit_report.json
            safety_report.json

  performance-test:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install pytest-benchmark

      - name: 检查性能测试目录
        id: check-perf-dir
        run: |
          if [ -d "tests/performance/" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 运行性能测试
        if: steps.check-perf-dir.outputs.exists == 'true'
        run: |
          pytest tests/performance/ -v --benchmark-only
          if [ $? -ne 0 ]; then
            echo "性能测试执行失败"
            exit 1
          fi

      - name: 跳过性能测试
        if: steps.check-perf-dir.outputs.exists == 'false'
        run: |
          echo "性能测试目录不存在，跳过性能测试"

      - name: 上传性能报告
        if: steps.check-perf-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            benchmarks.json
            tests/performance/results/

  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [critical-risk-gate, test, security-check, performance-test]
    if: always()
    steps:
      - name: 发送完成通知
        run: |
          GATE_RESULT="${{ needs.critical-risk-gate.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          SECURITY_RESULT="${{ needs.security-check.result }}"
          PERF_RESULT="${{ needs.performance-test.result }}"
          
          if [ "$GATE_RESULT" == "success" ] && \
             [ "$TEST_RESULT" == "success" ] && \
             [ "$SECURITY_RESULT" == "success" ] && \
             [ "$PERF_RESULT" == "success" ]; then
             echo "CI/CD 流水线执行成功"
          else
             echo "❌ CI/CD 流水线存在失败的任务"
             echo "P0门禁:  $GATE_RESULT"
             echo "测试结果: $TEST_RESULT"
             echo "安全检查结果: $SECURITY_RESULT"
             echo "性能测试结果: $PERF_RESULT"
             exit 1
          fi
