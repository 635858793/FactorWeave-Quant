name: 性能回归测试

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'hotfix/**', 'release/**']
    paths:
      - 'gui/widgets/chart_mixins/signal_mixin.py'
      - 'tests/test_pattern_color_performance.py'
      - 'analysis/pattern_base.py'
      - 'analysis/pattern_recognition.py'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'gui/widgets/chart_mixins/signal_mixin.py'
      - 'tests/test_pattern_color_performance.py'
      - 'analysis/pattern_base.py'
      - 'analysis/pattern_recognition.py'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  # 性能阈值
  THROUGHPUT_MIN: 1000          # 最小吞吐量 (次/秒)
  LATENCY_MAX_MS: 5.0           # 单次调用最大延迟 (ms)
  MEMORY_GROWTH_MAX_KB: 50      # 信号模块最大内存增长 (KB)
  SWITCH_LATENCY_MAX_MS: 10.0   # 快速切换时单次最大延迟 (ms)
  BATCH_LATENCY_MAX_MS: 50.0    # 批量渲染单次最大延迟 (ms)

jobs:
  performance-regression:
    name: 形态识别颜色渲染性能回归
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-timeout

      - name: 运行性能回归测试
        id: perf_test
        run: |
          echo "========================================="
          echo "  性能回归测试: 形态识别颜色渲染"
          echo "========================================="
          echo ""
          echo "阈值配置:"
          echo "  最小吞吐量:      ${{ env.THROUGHPUT_MIN }} 次/秒"
          echo "  单次调用最大延迟: ${{ env.LATENCY_MAX_MS }} ms"
          echo "  最大内存增长:     ${{ env.MEMORY_GROWTH_MAX_KB }} KB"
          echo "  快速切换最大延迟: ${{ env.SWITCH_LATENCY_MAX_MS }} ms"
          echo "  批量渲染最大延迟: ${{ env.BATCH_LATENCY_MAX_MS }} ms"
          echo ""

          pytest tests/test_pattern_color_performance.py \
            -v \
            --tb=short \
            --timeout=120 \
            -p no:warnings \
            2>&1 | tee perf_test_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "  性能回归测试失败!"
            echo "========================================="
            exit $EXIT_CODE
          fi

      - name: 生成性能报告摘要
        if: always()
        run: |
          echo "## 性能回归测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 指标 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY

          if [ -f perf_test_output.txt ]; then
            # 提取吞吐量
            THROUGHPUT=$(grep -oP '吞吐量.*?(\d+\.?\d*)\s*次/秒' perf_test_output.txt | grep -oP '\d+\.?\d*' | head -1)
            if [ -n "$THROUGHPUT" ]; then
              echo "| 吞吐量 | ${THROUGHPUT} 次/秒 |" >> $GITHUB_STEP_SUMMARY
            fi

            # 提取 PASS/FAIL 统计
            PASSED=$(grep -c "PASSED" perf_test_output.txt || echo "0")
            FAILED=$(grep -c "FAILED" perf_test_output.txt || echo "0")
            echo "| 通过 | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
            echo "| 失败 | ${FAILED} |" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "**状态: 失败**" >> $GITHUB_STEP_SUMMARY
            else
              echo "**状态: 通过**" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 上传测试输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-output
          path: perf_test_output.txt
          retention-days: 7

  memory-leak-check:
    name: 内存泄漏专项检测
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: performance-regression

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-timeout

      - name: 内存泄漏检测
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())

          import tracemalloc
          import gc
          import random
          import string

          # 模拟形态信息
          def generate_pattern_info():
              categories = ['reversal', 'continuation', 'trend', 'complex', 'volume', 'gap']
              signals = ['buy', 'sell', 'neutral']
              return {
                  'pattern_name': ''.join(random.choices(string.ascii_lowercase, k=10)),
                  'pattern_category': random.choice(categories),
                  'signal_type': random.choice(signals),
                  'pattern_type': 'default',
              }

          try:
              from gui.widgets.chart_mixins.signal_mixin import PatternStyleManager
          except ImportError:
              print('[SKIP] 无法导入 PatternStyleManager，跳过内存泄漏检测')
              sys.exit(0)

          tracemalloc.start()
          gc.collect()

          snapshot_before = tracemalloc.take_snapshot()

          # 执行 20,000 次调用
          for i in range(20000):
              data = generate_pattern_info()
              _ = PatternStyleManager.get_style_dynamic(data, is_dark=True)
              if (i + 1) % 5000 == 0:
                  gc.collect()

          gc.collect()
          snapshot_after = tracemalloc.take_snapshot()

          stats = snapshot_after.compare_to(snapshot_before, 'lineno')
          total_growth = sum(s.size_diff for s in stats if s.size_diff > 0)

          # 检查 signal_mixin 模块自身的内存增长
          signal_growth = sum(
              s.size_diff for s in stats
              if s.size_diff > 0 and 'signal_mixin' in str(s.traceback)
          )

          current_mem, peak_mem = tracemalloc.get_traced_memory()
          tracemalloc.stop()

          print(f'总内存增长: {total_growth / 1024:.1f} KB')
          print(f'信号模块增长: {signal_growth / 1024:.1f} KB')
          print(f'当前内存: {current_mem / 1024:.1f} KB')
          print(f'峰值内存: {peak_mem / 1024:.1f} KB')

          MAX_GROWTH_KB = ${{ env.MEMORY_GROWTH_MAX_KB }}
          if signal_growth > MAX_GROWTH_KB * 1024:
              print(f'[FAIL] 信号模块内存增长 {signal_growth/1024:.1f} KB > {MAX_GROWTH_KB} KB 阈值')
              sys.exit(1)
          else:
              print(f'[PASS] 信号模块内存增长 {signal_growth/1024:.1f} KB，正常')
          "