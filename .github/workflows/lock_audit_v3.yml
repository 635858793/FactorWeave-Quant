name: Lock Audit v3 (R162 HVD-162-B-3 CI 集成 + 4 锁 TDD 防回退)

# R162 HVD-162-B-3: 锁嵌套审计 v3 合并工具 CI 接入 (2026-07-21)
# Why: 5 工具并存 (_r160_c / _r160_c_v3 / audit_lock_nested_r104 / v2 / audit_lock_nesting_r163)
#      已合并为 tools/lock_audit_v3.py 统一入口, 启用 CI 防回退.
# 强约束: R104 §12 铁律 #3 递归 with.body + 铁律 #5 AST unparse + R100-F-P1-1 #8 4 锁独立
# 触发: 锁相关文件 push/PR + 每周一定时扫描 + TDD 防回退
# 拦截阈值: 0 violations (SAME_LOCK_NESTED = 0, CROSS_LOCK_NESTED_SAME_INSTANCE = 0)

on:
  push:
    branches: [main, dev, release/*]
    paths:
      - 'core/**/*.py'
      - 'plugins/**/*.py'
      - 'tools/lock_audit_v3.py'
      - 'tests/test_r162_hvd_162_b_2_lock_independence_tdd.py'
  pull_request:
    branches: [main, dev]
    paths:
      - 'core/**/*.py'
      - 'plugins/**/*.py'
      - 'tools/lock_audit_v3.py'
      - 'tests/test_r162_hvd_162_b_2_lock_independence_tdd.py'
  schedule:
    # 每周一 09:00 UTC+8 (北京时间) 自动运行
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit mode: core / plugins / all'
        required: false
        default: 'core'

jobs:
  lock-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lock audit v3 (strict mode)
        id: audit
        run: |
          echo "===== R162 HVD-162-B-3: 锁嵌套审计 v3 合并工具 ====="
          echo "R104 §12 铁律 #3 递归 with.body + 铁律 #5 AST unparse"
          echo "R100-F-P1-1 #8 4 锁独立策略 100% 核验"
          MODE="${{ github.event.inputs.mode || 'core' }}"
          python tools/lock_audit_v3.py \
            --mode "$MODE" \
            --strict \
            --output .trae/reports/monitoring/lock_audit_v3_$(date +%Y%m%d).json \
            --exit-code-on-violation
          AUDIT_EXIT=$?
          echo "Lock audit exit code: $AUDIT_EXIT"
          echo "AUDIT_EXIT=$AUDIT_EXIT" >> $GITHUB_ENV

      - name: Run 4-lock independence TDD (HVD-160-C-2 防回退)
        id: tdd
        run: |
          echo "===== R162 HVD-160-C-2: 4 锁独立 TDD 防回退测试 ====="
          echo "R100-F-P1-1 #8 4 锁独立策略永久防回退"
          echo "R104 §12 铁律 #3 嵌套检测递归 with.body + 铁律 #5 AST unparse"
          python -m pytest tests/test_r162_hvd_162_b_2_lock_independence_tdd.py \
            -v --tb=short --color=yes
          TDD_EXIT=$?
          echo "TDD exit code: $TDD_EXIT"
          echo "TDD_EXIT=$TDD_EXIT" >> $GITHUB_ENV

      - name: Save audit report as artifact
        if: always()
        run: |
          REPORT_PATH=".trae/reports/monitoring/lock_audit_v3_$(date +%Y%m%d).json"
          if [ -f "$REPORT_PATH" ]; then
            mkdir -p ci-artifacts
            cp "$REPORT_PATH" "ci-artifacts/lock_audit_v3_report.json"
            echo "Report saved: ci-artifacts/lock_audit_v3_report.json"
            cat "$REPORT_PATH" | head -60
          else
            echo "WARN: Report file not found at $REPORT_PATH"
          fi

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-audit-v3-report
          path: ci-artifacts/lock_audit_v3_report.json
          retention-days: 30

      - name: Fail job on lock nesting violation
        if: env.AUDIT_EXIT != '0'
        run: |
          echo "❌ R162 HVD-162-B-3 锁嵌套审计失败: 退出码 $AUDIT_EXIT"
          echo "0 violations 强制要求, 必须修复后方可合并"
          echo "违规清单: ci-artifacts/lock_audit_v3_report.json"
          exit $AUDIT_EXIT

      - name: Fail job on 4-lock TDD regression
        if: env.TDD_EXIT != '0'
        run: |
          echo "❌ R162 HVD-160-C-2 4 锁独立 TDD 防回退失败: 退出码 $TDD_EXIT"
          echo "13 个 TDD 用例必须 100% PASSED (R100-F-P1-1 #8 4 锁独立策略)"
          echo "参考: tests/test_r162_hvd_162_b_2_lock_independence_tdd.py"
          exit $TDD_EXIT
