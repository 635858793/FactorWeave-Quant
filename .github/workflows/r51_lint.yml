name: R51 静默失败检测 (R152 HVD-150-F)

# R152 HVD-150-F: R51 铁律 #5 入 CI (PR 检查)
# R51 铁律 #5: 禁止静默失败, 关键业务异常必须 warning/error + exc_info=True
# R118 例外: 字段降级/监控辅助保留 logger.debug (B15/B16), 已登记在 core/r118_exceptions_registry.yaml
# R85 假修复鉴别 4 步法 100% 命中
# R104 §12 5 铁律 100% 合规

on:
  # 推送到主分支
  push:
    branches: [main, develop]
    paths:
      - 'core/**'
      - 'gui/**'
      - 'services/**'
      - 'trading/**'
      - 'tools/r51_silent_failure_lint.py'
      - 'core/r118_exceptions_registry.yaml'
      - '.github/workflows/r51_lint.yml'
  # PR 触发
  pull_request:
    branches: [main, develop]
    paths:
      - 'core/**'
      - 'gui/**'
      - 'services/**'
      - 'trading/**'
      - 'tools/r51_silent_failure_lint.py'
      - 'core/r118_exceptions_registry.yaml'
      - '.github/workflows/r51_lint.yml'
  # 每周一 09:00 UTC+8 (北京时间) 定时扫描
  schedule:
    - cron: '0 1 * * 1'  # 01:00 UTC = 09:00 UTC+8 (周一)
  # 手动触发
  workflow_dispatch:
    inputs:
      max_violations:
        description: '最大允许违规数 (默认 0)'
        required: false
        default: '0'

env:
  PYTHON_VERSION: '3.11'

jobs:
  r51-lint:
    name: R51 静默失败检测
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装 PyYAML 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 验证 R118 例外登记清单存在
        run: |
          if [ ! -f "core/r118_exceptions_registry.yaml" ]; then
            echo "❌ R118 例外登记清单不存在: core/r118_exceptions_registry.yaml"
            exit 1
          fi
          echo "✅ R118 例外登记清单存在"

      - name: 运行 R51 静默失败检测 (max-violations=0)
        id: r51_lint
        run: |
          echo "========================================="
          echo " R51 铁律 #5 静默失败检测 (R152 HVD-150-F)"
          echo "========================================="
          python tools/r51_silent_failure_lint.py \
            --scan-path core \
            --scan-path gui \
            --scan-path services \
            --scan-path trading \
            --registry core/r118_exceptions_registry.yaml \
            --max-violations ${{ github.event.inputs.max_violations || '0' }} \
            --format json \
            --output r51_lint_report.json
          LINT_EXIT_CODE=$?
          echo "lint exit code: $LINT_EXIT_CODE"

          # 输出文本报告
          python tools/r51_silent_failure_lint.py \
            --scan-path core \
            --scan-path gui \
            --scan-path services \
            --scan-path trading \
            --registry core/r118_exceptions_registry.yaml \
            --max-violations ${{ github.event.inputs.max_violations || '0' }} \
            --format text \
            --output r51_lint_report.txt
          echo "文本报告已生成"

          # 摘要
          if [ -f r51_lint_report.json ]; then
            echo ""
            echo "========================================="
            echo " R51 Lint 摘要"
            echo "========================================="
            python -c "
import json
with open('r51_lint_report.json', 'r', encoding='utf-8') as f:
    report = json.load(f)
summary = report.get('summary', {})
meta = report.get('scan_metadata', {})
print(f'扫描文件数: {meta.get(\"files_scanned\", 0)}')
print(f'R118 豁免数: {meta.get(\"exempt_count\", 0)}')
print(f'P1 违规数:   {summary.get(\"p1_violations\", 0)}')
print(f'P2 违规数:   {summary.get(\"p2_violations\", 0)}')
print(f'违规总数:    {summary.get(\"total_violations\", 0)}')
print(f'通过阈值:    {summary.get(\"max_violations_threshold\", 0)}')
print(f'检测结果:    {\"✅ PASS\" if summary.get(\"pass\") else \"❌ FAIL\"}')
"
          fi

          if [ $LINT_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo " R51 铁律 #5 静默失败检测失败!"
            echo ""
            echo " 检测发现新增的 logger.debug 静默吞错点"
            echo " 修复方法:"
            echo "   1. 业务关键异常: logger.warning/error + exc_info=True"
            echo "   2. 字段降级/监控辅助: 在 core/r118_exceptions_registry.yaml 中登记"
            echo ""
            echo " R51 铁律 #5 强制度: 禁止静默失败"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit $LINT_EXIT_CODE
          fi
          echo "✅ R51 静默失败检测通过"

      - name: 上传 R51 Lint 报告 (JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r51-lint-report-json
          path: r51_lint_report.json

      - name: 上传 R51 Lint 报告 (TXT)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r51-lint-report-txt
          path: r51_lint_report.txt

      - name: PR 评论
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '❌ R51 静默失败检测失败\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('r51_lint_report.json', 'utf-8'));
              const sum = report.summary || {};
              const meta = report.scan_metadata || {};
              summary += `**扫描文件数**: ${meta.files_scanned || 0}\n`;
              summary += `**R118 豁免数**: ${meta.exempt_count || 0}\n`;
              summary += `**P1 违规数**: ${sum.p1_violations || 0}\n`;
              summary += `**P2 违规数**: ${sum.p2_violations || 0}\n`;
              summary += `**违规总数**: ${sum.total_violations || 0}\n\n`;
              summary += '**修复方法**:\n';
              summary += '1. 业务关键异常: `logger.warning/error + exc_info=True`\n';
              summary += '2. 字段降级/监控辅助: 在 `core/r118_exceptions_registry.yaml` 中登记\n\n';
              const violations = (report.violations || []).slice(0, 10);
              if (violations.length > 0) {
                summary += '**前 10 条违规**:\n';
                violations.forEach((v, i) => {
                  summary += `${i+1}. \`${v.file}:${v.line}\` (${v.severity}) - ${v.method}\n`;
                });
                if ((report.violations || []).length > 10) {
                  summary += `\n_...还有 ${(report.violations || []).length - 10} 条违规未显示_\n`;
                }
              }
            } catch (e) {
              summary += `\n⚠️ 解析报告失败: ${e.message}\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
