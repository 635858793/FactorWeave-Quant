name: Monitor Soft Parse (R7 §7.1 #5 + R135 HVD-C1)

# R135 HVD-C1 CI 集成 (2026-07-14)
# 目的: 持续监控全项目软解析点, 拦截 R51 铁律 #5 违规 (静默失败).
# 触发: 每次 push/PR + 每周一定时扫描
# 拦截阈值: 0 P1 违规 + 最多 5 P2 维持 (--max-violations 5)

on:
  push:
    branches: [main, dev, release/*]
    paths:
      - 'core/**/*.py'
      - 'gui/**/*.py'
      - 'tests/**/*.py'
      - 'web/**/*.py'
      - 'scripts/**/*.py'
      - 'tools/monitor_soft_parse.py'
  pull_request:
    branches: [main, dev]
    paths:
      - 'core/**/*.py'
      - 'gui/**/*.py'
      - 'tests/**/*.py'
      - 'web/**/*.py'
      - 'scripts/**/*.py'
      - 'tools/monitor_soft_parse.py'
  schedule:
    # 每周一 09:00 UTC+8 (北京时间) 自动运行
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      max_violations:
        description: 'Max violations (P1 + P2)'
        required: false
        default: '5'

jobs:
  monitor-soft-parse:
    name: Soft Parse Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 便于追溯

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 最小依赖: 监控脚本仅用标准库 (argparse, ast, re, json)
          # 但项目其他模块可能需要 loguru 等, 这里按需安装
          pip install loguru pytest 2>/dev/null || true

      - name: Run soft parse monitor (CI mode)
        id: monitor
        run: |
          echo "===== R7 §7.1 #5 软解析监控 (R135 HVD-C1) ====="
          python tools/monitor_soft_parse.py \
            --ci-mode \
            --report-format json \
            --max-violations ${{ github.event.inputs.max_violations || '5' }}
          MONITOR_EXIT=$?
          echo "Monitor exit code: $MONITOR_EXIT"
          echo "MONITOR_EXIT=$MONITOR_EXIT" >> $GITHUB_ENV

      - name: Save monitor report as artifact
        if: always()
        run: |
          REPORT_PATH=".trae/reports/monitoring/soft_parse_monitor_$(date +%Y%m%d).json"
          if [ -f "$REPORT_PATH" ]; then
            mkdir -p ci-artifacts
            cp "$REPORT_PATH" "ci-artifacts/soft_parse_monitor_report.json"
            echo "Report saved: ci-artifacts/soft_parse_monitor_report.json"
            # 打印报告摘要到 step log
            cat "$REPORT_PATH" | head -50
          else
            echo "WARN: Report file not found at $REPORT_PATH"
          fi

      - name: Upload monitor report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-parse-monitor-report
          path: ci-artifacts/soft_parse_monitor_report.json
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'ci-artifacts/soft_parse_monitor_report.json';
            if (!fs.existsSync(reportPath)) {
              console.log('Report file not found, skipping comment');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const summary = report.summary;
            const status = summary.compliance_status || 'UNKNOWN';
            const p1 = summary.p1_violation || 0;
            const p2 = summary.p2_maintain || 0;
            const ok = summary.ok_verified || 0;

            const statusEmoji = status === 'PASS' ? '✅' :
                                status === 'PASS_WITH_WARNINGS' ? '⚠️' : '❌';

            const body = `## ${statusEmoji} R7 §7.1 #5 软解析监控报告

            **状态**: ${status}
            **P1 违规**: ${p1} (目标: 0)
            **P2 维持**: ${p2} (R51 步 4 可选依赖, 维持 try_resolve)
            **OK 验证**: ${ok} (R51 防御完整)

            ${p1 > 0 ? '⚠️ **存在 P1 违规, 必须先修复再合并**\n\n 详见报告 ' + reportPath : '✅ **P1 违规 = 0, R51 铁律 #5 合规**'}

            📊 完整报告: \`ci-artifacts/soft_parse_monitor_report.json\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail job on P1 violation
        if: env.MONITOR_EXIT != '0'
        run: |
          echo "❌ R7 §7.1 #5 监控失败: 退出码 $MONITOR_EXIT"
          echo "P1 违规必须为 0. 当前状态见 ci-artifacts/soft_parse_monitor_report.json"
          exit $MONITOR_EXIT
